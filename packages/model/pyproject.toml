[project]
name = "noise-score"
version = "0.1.0"
description = "Personal Noise Score for NYC apartments: unit-level, by hour, from NYC open data. HCD team prototype."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
noise-score = "noise_score.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noise_score"]
