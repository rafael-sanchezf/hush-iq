[project]
name = "hush-iq-verdict"
version = "0.1.0"
description = "Hush IQ verdict writer: numbered evidence in, a cited 'what you'll hear' paragraph out (Muse Spark Open, checked in code, template fallback)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.40",
    "anthropic>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verdict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
